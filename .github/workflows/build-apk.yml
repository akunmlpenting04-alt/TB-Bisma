name: Build APK TB Bisma
on:
  workflow_dispatch:
  push:
    branches: [ main, tb-bisma-v2 ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0d1e3a' --splashBackgroundColor '#0d1e3a'
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TB-Bisma-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
