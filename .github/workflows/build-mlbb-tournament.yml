name: Build ML Tournament Vault APK
on:
  workflow_dispatch:
  push:
    branches: [ mlbb-tournament-app ]
    paths:
      - 'mlbb-tournament/**'
      - '.github/workflows/build-mlbb-tournament.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Unpack source
        run: |
          mkdir -p mlbb-tournament/app
          base64 -d mlbb-tournament/project.tgz.b64 > /tmp/mlbb-source.tgz
          tar -xzf /tmp/mlbb-source.tgz -C mlbb-tournament/app
      - name: Install dependencies
        working-directory: mlbb-tournament/app
        run: npm install --no-audit --no-fund
      - name: Run tests and build web app
        working-directory: mlbb-tournament/app
        run: npm run build
      - name: Add Android project
        working-directory: mlbb-tournament/app
        run: npx cap add android
      - name: Sync Android
        working-directory: mlbb-tournament/app
        run: npx cap sync android
      - name: Build APK
        working-directory: mlbb-tournament/app
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ML-Tournament-Vault-APK
          path: mlbb-tournament/app/android/app/build/outputs/apk/debug/app-debug.apk
